[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[theme]
base = "dark"
primaryColor       = "#c9a84c"   # gold — buttons, active tabs, highlights
backgroundColor    = "#0a0e1a"   # deep navy
secondaryBackgroundColor = "#0f1522"   # card backgrounds
textColor          = "#e8eaf0"   # off-white
font               = "monospace"
